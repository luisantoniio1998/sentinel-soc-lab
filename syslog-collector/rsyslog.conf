#############################
# SYSLOG COLLECTOR CONFIG
#############################

module(load="imuxsock")
module(load="imklog")

module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

$template CustomFormat,"%timegenerated:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n"
$ActionFileDefaultTemplate CustomFormat

if ($programname == 'webapp' or $msg contains 'LOGIN_ATTEMPT' or $msg contains 'SEARCH_QUERY') then {
    if ($msg contains 'LOGIN_ATTEMPT' or $msg contains 'LOGIN_SUCCESS' or $msg contains 'LOGIN_FAILED') then {
        action(type="omfile" file="/var/log/collect/webapp/auth.log")
    }
    if ($msg contains 'SEARCH_QUERY') then {
        action(type="omfile" file="/var/log/collect/webapp/search.log")
    }
    action(type="omfile" file="/var/log/collect/webapp/all.log")
    stop
}

if ($msg contains 'attack' or $msg contains 'scan' or $msg contains 'exploit') then {
    action(type="omfile" file="/var/log/collect/attacks/all.log")
    stop
}

if ($programname == 'sshd' or $programname == 'sudo') then {
    action(type="omfile" file="/var/log/collect/system/auth.log")
    stop
}

*.* /var/log/collect/system/all.log
